<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Time — 긴급 청취</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#0a0a0a; color:white;
            font-family:-apple-system,sans-serif;
            display:flex; align-items:center;
            justify-content:center; min-height:100vh;
            padding:20px;
        }
        .card {
            background:#1a1a1a; border-radius:24px;
            padding:40px 32px; max-width:380px;
            width:100%; text-align:center;
        }
        .icon { font-size:56px; margin-bottom:16px; }
        h1 { color:#ff3b30; font-size:22px; margin-bottom:8px; }
        .subtitle { color:#888; font-size:14px; margin-bottom:32px; }
        .status {
            background:#111; border-radius:12px;
            padding:12px 16px; margin-bottom:24px;
            font-size:14px; color:#ccc;
        }
        .wave {
            display:none; justify-content:center;
            gap:5px; margin:20px 0; height:40px;
            align-items:center;
        }
        .wave.active { display:flex; }
        .wave span {
            width:5px; background:#ff3b30; border-radius:3px;
            animation:wave 0.9s ease-in-out infinite;
        }
        .wave span:nth-child(2){ animation-delay:.15s; }
        .wave span:nth-child(3){ animation-delay:.30s; }
        .wave span:nth-child(4){ animation-delay:.45s; }
        .wave span:nth-child(5){ animation-delay:.60s; }
        @keyframes wave {
            0%,100%{ height:8px; } 50%{ height:36px; }
        }
        .btn {
            width:100%; padding:16px; border:none;
            border-radius:14px; font-size:16px;
            font-weight:700; cursor:pointer;
            margin-bottom:10px; transition:opacity .2s;
        }
        .btn:active { opacity:.7; }
        .btn-primary { background:#ff3b30; color:white; }
        .btn-secondary { background:#2a2a2a; color:#ccc; }
        .btn:disabled { background:#2a2a2a; color:#555; cursor:default; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">🚨</div>
    <h1>위험 신호 감지</h1>
    <p class="subtitle">Golden Time 긴급 알림</p>
    <div class="status" id="status">청취 버튼을 눌러 실시간으로 확인하세요</div>
    <div class="wave" id="wave">
        <span></span><span></span><span></span>
        <span></span><span></span>
    </div>
    <button class="btn btn-primary" id="listenBtn" onclick="startListening()">
        🎧 지금 바로 듣기
    </button>
    <button class="btn btn-secondary" onclick="location.href='tel:119'">
        📞 119 신고
    </button>
</div>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
<script>
const params   = new URLSearchParams(location.search);
const channel  = params.get('channel');
const tokenUrl = params.get('tokenUrl');

async function startListening() {
    const btn = document.getElementById('listenBtn');
    btn.disabled = true;
    setStatus('🔄 연결 중...');
    try {
        const res  = await fetch(`${tokenUrl}/api/token?channel=${channel}&uid=999`);
        const data = await res.json();
        const client = AgoraRTC.createClient({ mode:'rtc', codec:'vp8' });
        await client.join(data.appId, channel, data.token, 999);
        client.on('user-published', async (user, type) => {
            await client.subscribe(user, type);
            if (type === 'audio') {
                user.audioTrack.play();
                setStatus('🔴 실시간 청취 중');
                document.getElementById('wave').classList.add('active');
                btn.textContent = '청취 중...';
            }
        });
        client.on('user-unpublished', () => {
            setStatus('연결이 종료되었습니다.');
            document.getElementById('wave').classList.remove('active');
        });
    } catch(e) {
        setStatus('연결 실패: ' + e.message);
        btn.disabled = false;
    }
}
function setStatus(msg) {
    document.getElementById('status').textContent = msg;
}
</script>
</body>
</html>
