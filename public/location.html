<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Time - 실시간 위치</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #111; color: white; }
  #map { width: 100vw; height: 70vh; }
  .info { padding: 16px 20px; }
  .status { font-size: 14px; color: #ff3b30; font-weight: bold; margin-bottom: 6px; }
  .time { font-size: 13px; color: #888; }
  .pulse { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
           background: #ff3b30; margin-right: 6px;
           animation: pulse 1s infinite; }
  @keyframes pulse {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.3); }
    100% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="info">
  <div class="status"><span class="pulse"></span>실시간 위치 추적 중</div>
  <div class="time" id="updateTime">위치 불러오는 중...</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const userId = new URLSearchParams(location.search).get('userId');
const map = L.map('map').setView([37.5665, 126.9780], 16);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

const icon = L.divIcon({
  html: '<div style="width:20px;height:20px;border-radius:50%;background:#ff3b30;border:3px solid white;box-shadow:0 0 10px rgba(255,59,48,0.8)"></div>',
  iconSize: [20, 20],
  iconAnchor: [10, 10],
  className: ''
});

let marker = null;

async function fetchLocation() {
  if (!userId) {
    document.getElementById('updateTime').textContent = 'userId가 없습니다';
    return;
  }
  try {
    const res = await fetch(`/api/location?userId=${userId}`);
    const data = await res.json();
    if (data.lat && data.lng) {
      const pos = [data.lat, data.lng];
      if (!marker) {
        marker = L.marker(pos, { icon }).addTo(map);
      } else {
        marker.setLatLng(pos);
      }
      map.panTo(pos);
      const t = new Date(data.updated_at);
      document.getElementById('updateTime').textContent =
        `마지막 업데이트: ${t.toLocaleTimeString('ko-KR')}`;
    }
  } catch(e) {
    document.getElementById('updateTime').textContent = '위치 불러오기 실패';
  }
}

fetchLocation();
setInterval(fetchLocation, 10000);
</script>
</body>
</html>
